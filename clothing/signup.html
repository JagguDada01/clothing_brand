<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Velmora — Create an Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,600;9..144,700&family=Space+Grotesk:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-page">
    <header class="site-header">
      <div class="brand">
        <a href="index.html" class="brand-link" style="display:flex;align-items:center;gap:16px;">
          <img class="brand-logo" src="assets/logo-velmora.svg" alt="Velmora logo" />
          <div>
            <p class="brand-name">Velmora</p>
            <p class="brand-tag">Everyday essentials</p>
          </div>
        </a>
      </div>
      <div class="header-actions">
        <a class="btn ghost" href="index.html">← Back to Store</a>
        <a class="btn" href="login.html">Sign in</a>
      </div>
    </header>

    <main class="auth-main">
      <section class="auth-card">
        <div>
          <p class="eyebrow">Join the Collective</p>
          <h1>Create account</h1>
          <p class="muted">Sign up to add items to your cart, reserve limited seasonal runs, and receive early drops.</p>
        </div>

        <div id="authNotice" class="auth-notice"></div>

        <form class="auth-form" id="signupForm">
          <label for="signupName">Full Name</label>
          <input id="signupName" type="text" placeholder="e.g. Camille Laurent" required autocomplete="name" />

          <label for="signupEmail">Email Address</label>
          <input id="signupEmail" type="email" placeholder="you@example.com" required autocomplete="email" />

          <label for="signupPassword">Password</label>
          <input id="signupPassword" type="password" placeholder="Minimum 6 characters" required autocomplete="new-password" />

          <label for="signupConfirm">Confirm Password</label>
          <input id="signupConfirm" type="password" placeholder="Repeat your password" required autocomplete="new-password" />

          <button class="btn" type="submit">Create account & Continue</button>
        </form>

        <p class="muted auth-switch">
          Already have an account? <a href="login.html">Sign in instead</a>
        </p>
      </section>
    </main>

    <script src="auth.js"></script>
  </body>
</html>
